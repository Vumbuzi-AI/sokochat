# Local S3-compatible storage for product images.
# Same shape you can run on the VPS next to the app.
#
#   docker compose -f compose.minio.yml up -d
#
# API:    http://127.0.0.1:9000
# Console http://127.0.0.1:9001  (sokochat / sokochatsecret)
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sokochat
      MINIO_ROOT_PASSWORD: sokochatsecret
    volumes:
      - minio_data:/data

volumes:
  minio_data:
