services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 210s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    environment:
      NODE_ENV: production
      PI_HOST: 0.0.0.0
      PI_PORT: "4100"
      PI_DATA_DIR: /var/lib/sokochat-pi
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Coolify}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-off}
      PI_SERVICE_TOKEN: ${PI_SERVICE_TOKEN:?Set the same PI_SERVICE_TOKEN in Phoenix and Pi}
      SOKOCHAT_INTERNAL_URL: ${SOKOCHAT_INTERNAL_URL:?Set the HTTPS SokoChat origin}
      PI_WORKSPACE_DAILY_TURN_LIMIT: ${PI_WORKSPACE_DAILY_TURN_LIMIT:-1000}
    expose:
      - "4100"
    volumes:
      - pi-data:/var/lib/sokochat-pi
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

volumes:
  pi-data:
